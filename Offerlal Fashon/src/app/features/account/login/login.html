<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>

    @if (justReset()) {
      <p class="notice">Your password has been updated. Please sign in with your new password.</p>
    }

    <!--
      The OTP tab that used to sit here only ever announced that OTP sign-in was
      unavailable. A tab whose entire content is "this doesn't work" still costs
      a tap and still invites the question. It returns when the flow is real.
    -->
    <label>
      Email
      <input type="email" [value]="email()" (input)="email.set($any($event.target).value)" (keyup.enter)="loginWithEmail()" />
    </label>
    <label>
      Password
      <input
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        (keyup.enter)="loginWithEmail()"
      />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="button" class="btn btn-primary full" [disabled]="loading()" (click)="loginWithEmail()">
      {{ loading() ? 'Signing In...' : 'Sign In' }}
    </button>
    <a class="forgot-link" routerLink="/forgot-password">Forgot Password?</a>

    <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
