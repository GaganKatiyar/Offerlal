<div class="auth-page">
  <div class="auth-card">
    <h1>Reset Your Password</h1>

    @if (step() === 'request') {
      <p class="notice">Enter the email on your account and we'll send a reset code.</p>

      <label>
        Email
        <input
          type="email"
          autocomplete="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          (keyup.enter)="requestCode()"
        />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="button" class="btn btn-primary full" [disabled]="loading()" (click)="requestCode()">
        {{ loading() ? 'Sending…' : 'Send Reset Code' }}
      </button>
    } @else {
      @if (message()) {
        <p class="notice">{{ message() }}</p>
      }

      <label>
        Reset Code
        <input
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          [value]="code()"
          (input)="code.set($any($event.target).value)"
        />
      </label>
      <label>
        New Password
        <input
          type="password"
          autocomplete="new-password"
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
          (keyup.enter)="resetPassword()"
        />
        <small class="hint">At least 8 characters.</small>
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="button" class="btn btn-primary full" [disabled]="loading()" (click)="resetPassword()">
        {{ loading() ? 'Resetting…' : 'Reset Password' }}
      </button>

      <!--
        The code expires in 30 minutes on the server; letting someone go back
        and re-enter a different email without reloading the page is worth more
        than forcing a fresh page load for what is, functionally, "start over".
      -->
      <button type="button" class="link-btn" (click)="step.set('request')">Use a different email</button>
    }

    <p class="switch-link">Remembered it? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
