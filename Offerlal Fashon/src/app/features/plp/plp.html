<div class="plp-header">
  <div class="container">
    <app-breadcrumb [crumbs]="breadcrumbs()" />
    <h1>{{ pageTitle() }}</h1>
    @if (currentCategory()?.description) {
      <p class="plp-desc">{{ currentCategory()!.description }}</p>
    }
  </div>
</div>

<div class="container">
  <app-product-browser
    [categoryId]="currentCategory()?.id"
    [occasionId]="currentOccasion()?.id"
    [newArrivals]="mode === 'new-arrivals'"
    [onSale]="mode === 'sale'"
  />
</div>
