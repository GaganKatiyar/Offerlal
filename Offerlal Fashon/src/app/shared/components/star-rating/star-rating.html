<span class="stars" [class.md]="size() === 'md'" [attr.aria-label]="rating() + ' out of 5 stars'">
  @for (fill of stars(); track $index) {
    <span class="star">
      <span class="star-fill" [style.width.%]="fill">★</span>
      <span class="star-outline">★</span>
    </span>
  }
</span>
@if (showValue()) {
  <span class="rating-value">{{ rating().toFixed(1) }}</span>
}
